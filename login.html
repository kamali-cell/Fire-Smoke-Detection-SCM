<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fire & Smoke Detection - Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-box">

            <h1>🔥 Fire & Smoke</h1>

            <h2>SCM Monitoring System</h2>

            <p class="login-subtitle">
                Secure Login
            </p>

            <form onsubmit="loginUser(); return false;">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="login-info">
                Demo Username: admin
                <br>
                Demo Password: admin123
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
